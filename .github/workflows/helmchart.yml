name: Package & Push Helmchart

on:
  push:
    tags:
      - "chart-v[0-9]*"

permissions:
  id-token: write
  contents: read

jobs:
  package-and-push-chart:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::138420161232:role/github-optiq
          aws-region: eu-central-1
          audience: sts.amazonaws.com

      - name: Login to ECR (Helm OCI)
        run: |
          aws ecr get-login-password | helm registry login \
            --username AWS \
            --password-stdin 138420161232.dkr.ecr.eu-central-1.amazonaws.com

      - name: Lint Helm chart
        run: helm lint chart/

      - name: Build dependencies
        run: helm dependency update chart/

      - name: Package chart
        run: helm package chart/

      - name: Push Helm chart
        run: |
          helm push optiq-*.tgz oci://138420161232.dkr.ecr.eu-central-1.amazonaws.com
