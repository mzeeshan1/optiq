apiVersion: v1
kind: Secret
metadata:
  name: {{ include "optiq.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "optiq.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  DATABASE_URL: {{ printf "postgres://%s:%s@%s:5432/%s?sslmode=disable" .Values.postgres.user .Values.secrets.postgresPassword (include "optiq.postgresHost" .) .Values.postgres.database | quote }}
  JWT_SECRET: {{ required "secrets.jwtSecret is required" .Values.secrets.jwtSecret | quote }}
