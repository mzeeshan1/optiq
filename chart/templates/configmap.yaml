apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "optiq.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "optiq.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.config.port | quote }}
  REDIS_URL: {{ printf "redis://%s:6379" (include "optiq.redisHost" .) | quote }}
  SEED_PRODUCTS: {{ .Values.config.seedProducts | quote }}
  SEED_CUSTOMERS: {{ .Values.config.seedCustomers | quote }}
  FULFILMENT_INTERVAL: {{ .Values.config.fulfilmentInterval | quote }}
