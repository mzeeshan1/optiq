services:

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/optiq?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      SEED_PRODUCTS: ${SEED_PRODUCTS:-1000}
      SEED_CUSTOMERS: ${SEED_CUSTOMERS:-200}
      FULFILMENT_INTERVAL: ${FULFILMENT_INTERVAL:-30s}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Simulated shoppers. Start with: docker compose --profile loadgen up
  loadgen:
    build:
      context: .
      target: loadgen
    profiles: ["loadgen"]
    environment:
      TARGET: http://app:8080
      USERS: ${USERS:-20}
      RPS: ${RPS:-15}
      DURATION: ${DURATION:-0}
    depends_on:
      app:
        condition: service_healthy

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: optiq
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
