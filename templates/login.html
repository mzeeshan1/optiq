{{define "login.html"}}
{{template "head" .}}
{{template "nav" .}}
<div class="flex items-center justify-center px-4 py-16">
  <div class="w-full max-w-md">
    <h1 class="text-2xl font-bold text-slate-900">Sign in</h1>
    <p class="text-slate-500 text-sm mt-1 mb-6">Track orders, save favourites and book eye tests.</p>

    {{template "alert" .Error}}

    <form method="POST" action="/login" class="space-y-4">
      <input type="hidden" name="next" value="{{.Next}}">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1" for="email">Email</label>
        <input id="email" type="email" name="email" value="{{.FormEmail}}" required autocomplete="email"
          class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1" for="password">Password</label>
        <input id="password" type="password" name="password" required autocomplete="current-password"
          class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-400" />
      </div>
      <button type="submit" class="w-full bg-slate-900 text-white font-semibold py-2.5 rounded-full hover:bg-slate-700 text-sm">Sign in</button>
    </form>

    <p class="text-center text-sm text-slate-500 mt-6">
      New to optiq? <a href="/register{{if .Next}}?next={{.Next}}{{end}}" class="text-sky-800 hover:underline font-medium">Create an account</a>
    </p>
  </div>
</div>
{{template "foot" .}}
{{end}}
