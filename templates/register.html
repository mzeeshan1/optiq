{{define "register.html"}}
{{template "head" .}}
{{template "nav" .}}
<div class="flex items-center justify-center px-4 py-16">
  <div class="w-full max-w-md">
    <h1 class="text-2xl font-bold text-slate-900">Create your account</h1>
    <p class="text-slate-500 text-sm mt-1 mb-6">It takes less than a minute.</p>

    {{template "alert" .Error}}

    <form method="POST" action="/register" class="space-y-4">
      <input type="hidden" name="next" value="{{.Next}}">
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1" for="first_name">First name</label>
          <input id="first_name" name="first_name" value="{{.FormFirstName}}" required autocomplete="given-name" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1" for="last_name">Last name</label>
          <input id="last_name" name="last_name" value="{{.FormLastName}}" autocomplete="family-name" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1" for="email">Email</label>
        <input id="email" type="email" name="email" value="{{.FormEmail}}" required autocomplete="email" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1" for="password">Password</label>
        <input id="password" type="password" name="password" required minlength="8" autocomplete="new-password" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
        <p class="text-xs text-slate-400 mt-1">At least 8 characters.</p>
      </div>
      <button type="submit" class="w-full bg-slate-900 text-white font-semibold py-2.5 rounded-full hover:bg-slate-700 text-sm">Create account</button>
    </form>

    <p class="text-center text-sm text-slate-500 mt-6">
      Already have an account? <a href="/login{{if .Next}}?next={{.Next}}{{end}}" class="text-sky-800 hover:underline font-medium">Sign in</a>
    </p>
  </div>
</div>
{{template "foot" .}}
{{end}}
